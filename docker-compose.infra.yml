# Infrastructure-only compose file.
# Use this when running Go services and the Next.js frontend locally.
#
#   docker compose -f docker-compose.infra.yml up -d
#   sh scripts/dev.sh
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustinbox
      POSTGRES_PASSWORD: trustinbox_dev
      POSTGRES_DB: trustinbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustinbox"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trustinbox
      MINIO_ROOT_PASSWORD: trustinbox_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  ejabberd:
    image: ejabberd/ecs:24.02
    environment:
      EJABBERD_DOMAIN: chat.trustinbox.local
      EJABBERD_ADMIN: admin
      EJABBERD_ADMIN_PASSWORD: ejabberd_admin_dev
    ports:
      - "5222:5222"
      - "5280:5280"
    volumes:
      - ./infra/ejabberd/ejabberd.yml:/home/ejabberd/conf/ejabberd.yml:ro
      - ./infra/ejabberd/jwt_secret:/home/ejabberd/conf/jwt_secret:ro
      - ejabberddata:/home/ejabberd
    healthcheck:
      test: ["CMD", "/home/ejabberd/bin/ejabberdctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: trustinbox_dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  # ─── ChromaDB — vector database for RAG knowledge retrieval ────────────────
  chromadb:
    image: chromadb/chroma:0.6.3
    environment:
      CHROMA_SERVER_ALLOW_RESET: "true"
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "8000:8000"
    volumes:
      - chromadbdata:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n — workflow automation engine triggered by bots via execute_workflow tool.
  # Owner UI: http://localhost:5678  (login: admin / trustinbox_n8n_dev)
  # Webhook base URL used by bot-service: http://n8n:5678 (inside Docker)
  #                                       http://localhost:5678 (from host)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      # ─── Auth (Basic Auth gate on the editor UI) ────────────
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: trustinbox_n8n_dev
      # ─── Public/Webhook URLs ────────────────────────────────
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # ─── Runtime config ─────────────────────────────────────
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # ─── 32-byte key used to encrypt stored credentials ─────
      # In production replace with a secret from a vault.
      N8N_ENCRYPTION_KEY: trustinbox_n8n_encryption_key_dev_32b
      # ─── Shared HMAC secret for TrustInbox ↔ n8n callbacks ──
      # Mirror this in the gateway + bot-service env (N8N_WEBHOOK_SECRET).
      TRUSTINBOX_WEBHOOK_SECRET: trustinbox_n8n_webhook_secret_dev
      # ─── Resume callback target (gateway public URL) ────────
      TRUSTINBOX_GATEWAY_URL: http://host.docker.internal:4000
    volumes:
      - n8ndata:/home/node/.n8n
    extra_hosts:
      # Allow workflows to reach gateway/services running on the host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
  ejabberddata:
  prometheusdata:
  grafanadata:
  n8ndata:
  chromadbdata:
