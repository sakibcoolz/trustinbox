global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Gateway (HTTP metrics) ─────────────────────────────────
  - job_name: graphql-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["graphql-gateway:4000"]
        labels:
          service: graphql-gateway

  # ── Go gRPC services (via OTel collector) ──────────────────
  # The OTel collector exposes a Prometheus exporter for metrics
  # collected from all services via OTLP.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: otel-collector

  # Prometheus-formatted metrics exported by the OTel collector
  - job_name: otel-exported-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-exporter

  # ── Individual service scrape (direct, if services expose /metrics) ─
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:50051"]
        labels:
          service: auth-service

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:50052"]
        labels:
          service: user-service

  - job_name: policy-service
    metrics_path: /metrics
    static_configs:
      - targets: ["policy-service:50053"]
        labels:
          service: policy-service

  - job_name: organization-service
    metrics_path: /metrics
    static_configs:
      - targets: ["organization-service:50054"]
        labels:
          service: organization-service

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:50055"]
        labels:
          service: notification-service

  - job_name: communication-service
    metrics_path: /metrics
    static_configs:
      - targets: ["communication-service:50056"]
        labels:
          service: communication-service

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:50057"]
        labels:
          service: ai-service

  - job_name: worker-service
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-service:50058"]
        labels:
          service: worker-service

  - job_name: bot-service
    metrics_path: /metrics
    static_configs:
      - targets: ["bot-service:50059"]
        labels:
          service: bot-service

  - job_name: webhook-service
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-service:50060"]
        labels:
          service: webhook-service

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-service:50061"]
        labels:
          service: analytics-service

  # ── Infrastructure ─────────────────────────────────────────
  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
