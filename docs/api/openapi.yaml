openapi: "3.1.0"
info:
  title: TrustInbox Provider API
  version: "1.0.0"
  description: |
    REST API for verified service providers to send notifications, manage
    callback requests, bots, webhooks, campaigns, and view analytics.
    All endpoints require a valid API key via the `X-API-Key` header.
  contact:
    name: TrustInbox Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Service provider API key in the form `{prefix}.{secret}`

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Notification ─────────────────────────────────────────
    CreateNotificationRequest:
      type: object
      required: [userId, category, title, body]
      properties:
        userId:
          type: string
          format: uuid
        category:
          type: string
          enum: [PERSONAL, SERVICE_PROVIDER, ADVERTISEMENT]
        title:
          type: string
        body:
          type: string
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        metadata:
          type: object
          additionalProperties:
            type: string

    CreateNotificationResponse:
      type: object
      properties:
        notificationId:
          type: string
        status:
          type: string
        rejectionReason:
          type: string

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        serviceProviderId:
          type: string
        category:
          type: string
        title:
          type: string
        body:
          type: string
        priority:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer

    # ── Callback Request ─────────────────────────────────────
    CreateCallbackRequest:
      type: object
      required: [userId, reason]
      properties:
        userId:
          type: string
          format: uuid
        reason:
          type: string
        details:
          type: string

    CreateCallbackResponse:
      type: object
      properties:
        callbackRequestId:
          type: string
        status:
          type: string
        rejectionReason:
          type: string

    CallbackRequest:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        serviceProviderId:
          type: string
        reason:
          type: string
        details:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, RESCHEDULED, EXPIRED]
        requestedAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time

    CallbackRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/CallbackRequest"
        total:
          type: integer

    # ── Message ──────────────────────────────────────────────
    SendMessageRequest:
      type: object
      required: [conversationId, content]
      properties:
        conversationId:
          type: string
          format: uuid
        content:
          type: string
        messageType:
          type: string
          enum: [TEXT, IMAGE, DOCUMENT, SYSTEM]

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderType:
          type: string
        senderRefId:
          type: string
        messageType:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time

    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        total:
          type: integer

    # ── Document ─────────────────────────────────────────────
    ShareDocumentRequest:
      type: object
      required: [userId, documentId]
      properties:
        userId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        shareContext:
          type: string
          enum: [NOTIFICATION, CHAT, CALLBACK, DIRECT]

    ShareDocumentResponse:
      type: object
      properties:
        documentShareId:
          type: string
        success:
          type: boolean

    # ── Webhook ──────────────────────────────────────────────
    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED, DISABLED]
        newSecret:
          type: string

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        serviceProviderId:
          type: string
        url:
          type: string
        description:
          type: string
        events:
          type: array
          items:
            type: string
        status:
          type: string
        failureCount:
          type: integer
        maxRetries:
          type: integer
        lastDeliveryAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    WebhookSubscriptionList:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscription"
        total:
          type: integer

    WebhookDeliveryList:
      type: object
      properties:
        deliveries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              subscriptionId:
                type: string
              eventType:
                type: string
              responseStatus:
                type: integer
              attemptCount:
                type: integer
              status:
                type: string
              durationMs:
                type: integer
              createdAt:
                type: string
                format: date-time
        total:
          type: integer

    TestWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        responseStatus:
          type: integer
        responseBody:
          type: string
        durationMs:
          type: integer

    # ── Bot ──────────────────────────────────────────────────
    CreateBotRequest:
      type: object
      required: [name, purpose]
      properties:
        name:
          type: string
        purpose:
          type: string
        department:
          type: string
        industryProfileId:
          type: string
        avatarUrl:
          type: string
        createdBySpUserId:
          type: string

    UpdateBotRequest:
      type: object
      properties:
        name:
          type: string
        purpose:
          type: string
        department:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED]

    Bot:
      type: object
      properties:
        id:
          type: string
        serviceProviderId:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        purpose:
          type: string
        department:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BotList:
      type: object
      properties:
        bots:
          type: array
          items:
            $ref: "#/components/schemas/Bot"
        total:
          type: integer

    BotConfiguration:
      type: object
      properties:
        botId:
          type: string
        tone:
          type: string
        writingStyle:
          type: string
        supportedLanguages:
          type: array
          items:
            type: string
        workingHoursStart:
          type: string
        workingHoursEnd:
          type: string
        workingDays:
          type: array
          items:
            type: integer
        maxTurnsBeforeEscalation:
          type: integer
        customSystemPrompt:
          type: string
        temperature:
          type: number

    ExecuteBotActionRequest:
      type: object
      required: [conversationId, userId, actionType]
      properties:
        conversationId:
          type: string
        userId:
          type: string
        actionType:
          type: string
        toolName:
          type: string
        inputJson:
          type: string

    ExecuteBotActionResponse:
      type: object
      properties:
        success:
          type: boolean
        outputJson:
          type: string
        policyDecision:
          type: string
        policyReason:
          type: string
        escalated:
          type: boolean

    BotActionLogList:
      type: object
      properties:
        logs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              botId:
                type: string
              actionType:
                type: string
              toolUsed:
                type: string
              policyDecision:
                type: string
              durationMs:
                type: integer
              success:
                type: boolean
              createdAt:
                type: string
                format: date-time
        total:
          type: integer

    BotAnalytics:
      type: object
      properties:
        botId:
          type: string
        totalConversations:
          type: integer
        totalMessagesSent:
          type: integer
        totalActionsExecuted:
          type: integer
        totalEscalations:
          type: integer
        escalationRate:
          type: number
        resolutionRate:
          type: number
        satisfactionScore:
          type: number

    # ── Analytics ────────────────────────────────────────────
    DashboardStats:
      type: object
      properties:
        notificationsSent:
          type: integer
        notificationsDelivered:
          type: integer
        notificationsRead:
          type: integer
        callbacksRequested:
          type: integer
        callbacksApproved:
          type: integer
        messagesSent:
          type: integer
        documentsShared:
          type: integer
        botActions:
          type: integer
        spamReports:
          type: integer
        policyDenials:
          type: integer
        webhookDeliveries:
          type: integer
        deliveryRate:
          type: number
        readRate:
          type: number

    DailyAnalyticsEntry:
      type: object
      properties:
        date:
          type: string
        notificationsSent:
          type: integer
        notificationsDelivered:
          type: integer
        notificationsRead:
          type: integer
        callbacksRequested:
          type: integer
        messagesSent:
          type: integer
        botActions:
          type: integer
        spamReports:
          type: integer
        policyDenials:
          type: integer

  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    fromParam:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    toParam:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time

paths:
  # ── Notifications ────────────────────────────────────────
  /api/v1/notifications:
    post:
      summary: Send a notification to a user
      operationId: createNotification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNotificationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid API Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List notifications
      operationId: listNotifications
      tags: [Notifications]
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  # ── Callbacks ────────────────────────────────────────────
  /api/v1/callbacks:
    post:
      summary: Create a callback request for a user
      operationId: createCallbackRequest
      tags: [Callbacks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCallbackRequest"
      responses:
        "201":
          description: Callback request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCallbackResponse"
    get:
      summary: List callback requests
      operationId: listCallbackRequests
      tags: [Callbacks]
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Callback request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackRequestList"

  /api/v1/callbacks/{id}:
    get:
      summary: Get a specific callback request
      operationId: getCallbackRequest
      tags: [Callbacks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Callback request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackRequest"
        "404":
          description: Not found

  # ── Messages ─────────────────────────────────────────────
  /api/v1/messages:
    post:
      summary: Send a message in a conversation
      operationId: sendMessage
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    get:
      summary: List messages in a conversation
      operationId: listMessages
      tags: [Messages]
      parameters:
        - name: conversationId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"

  # ── Documents ────────────────────────────────────────────
  /api/v1/documents:
    post:
      summary: Share a document with a user
      operationId: shareDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareDocumentRequest"
      responses:
        "201":
          description: Document shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareDocumentResponse"

  # ── Campaigns ────────────────────────────────────────────
  /api/v1/campaigns:
    get:
      summary: Get campaign summary stats
      operationId: getCampaignSummary
      tags: [Campaigns]
      responses:
        "200":
          description: Campaign summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaignsLaunched:
                    type: integer
                  totalSent:
                    type: integer
                  deliveryRate:
                    type: number
                  readRate:
                    type: number

  /api/v1/campaigns/{id}/analytics:
    get:
      summary: Get analytics for a specific campaign
      operationId: getCampaignAnalytics
      tags: [Campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalTargets:
                    type: integer
                  totalSent:
                    type: integer
                  totalDelivered:
                    type: integer
                  totalRead:
                    type: integer
                  deliveryRate:
                    type: number

  # ── Webhooks ─────────────────────────────────────────────
  /api/v1/webhooks:
    post:
      summary: Create a webhook subscription
      operationId: createWebhookSubscription
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
    get:
      summary: List webhook subscriptions
      operationId: listWebhookSubscriptions
      tags: [Webhooks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionList"

  /api/v1/webhooks/{id}:
    get:
      summary: Get a webhook subscription
      operationId: getWebhookSubscription
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
    put:
      summary: Update a webhook subscription
      operationId: updateWebhookSubscription
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
    delete:
      summary: Delete a webhook subscription
      operationId: deleteWebhookSubscription
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/v1/webhooks/{id}/test:
    post:
      summary: Send a test payload to a webhook subscription
      operationId: testWebhookSubscription
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWebhookResponse"

  /api/v1/webhooks/{id}/deliveries:
    get:
      summary: List deliveries for a webhook subscription
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Delivery list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"

  # ── Bots ─────────────────────────────────────────────────
  /api/v1/bots:
    post:
      summary: Create a bot
      operationId: createBot
      tags: [Bots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotRequest"
      responses:
        "201":
          description: Bot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
    get:
      summary: List bots
      operationId: listBots
      tags: [Bots]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED]
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Bot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotList"

  /api/v1/bots/{id}:
    get:
      summary: Get a bot
      operationId: getBot
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
    put:
      summary: Update a bot
      operationId: updateBot
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotRequest"
      responses:
        "200":
          description: Updated bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
    delete:
      summary: Delete a bot
      operationId: deleteBot
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /api/v1/bots/{id}/config:
    get:
      summary: Get bot configuration
      operationId: getBotConfiguration
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfiguration"
    put:
      summary: Update bot configuration
      operationId: updateBotConfiguration
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfiguration"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfiguration"

  /api/v1/bots/{id}/actions:
    post:
      summary: Execute a bot action
      operationId: executeBotAction
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteBotActionRequest"
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteBotActionResponse"
    get:
      summary: List bot action logs
      operationId: listBotActionLogs
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Action log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotActionLogList"

  /api/v1/bots/{id}/analytics:
    get:
      summary: Get bot analytics
      operationId: getBotAnalytics
      tags: [Bots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotAnalytics"

  # ── Analytics ────────────────────────────────────────────
  /api/v1/analytics/dashboard:
    get:
      summary: Get dashboard analytics
      operationId: getDashboardAnalytics
      tags: [Analytics]
      parameters:
        - $ref: "#/components/parameters/fromParam"
        - $ref: "#/components/parameters/toParam"
      responses:
        "200":
