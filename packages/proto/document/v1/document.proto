syntax = "proto3";

package document.v1;

option go_package = "github.com/trustinbox/proto/gen/document/v1;documentv1";

import "google/protobuf/timestamp.proto";

service DocumentService {
  // Document lifecycle
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc UpdateDocument(UpdateDocumentRequest) returns (Document);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Presigned URLs
  rpc GeneratePresignedURL(GeneratePresignedURLRequest) returns (PresignedURLResponse);

  // Classification
  rpc ClassifyDocument(ClassifyDocumentRequest) returns (DocumentClassification);
  rpc GetDocumentClassifications(GetDocumentClassificationsRequest) returns (GetDocumentClassificationsResponse);

  // Version tracking
  rpc CreateDocumentVersion(CreateDocumentVersionRequest) returns (DocumentVersion);
  rpc ListDocumentVersions(ListDocumentVersionsRequest) returns (ListDocumentVersionsResponse);
  rpc GetDocumentVersion(GetDocumentVersionRequest) returns (DocumentVersion);

  // Download tracking
  rpc TrackDownload(TrackDownloadRequest) returns (DownloadRecord);
}

// ─── Document ───────────────────────────────────────────────

message Document {
  string id = 1;
  string service_provider_id = 2;
  string uploaded_by_sp_user_id = 3;
  string file_name = 4;
  string file_type = 5;
  string s3_key = 6;
  int64 file_size = 7;
  string classification = 8;
  string status = 9; // ACTIVE, ARCHIVED, DELETED
  int32 current_version = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CreateDocumentRequest {
  string service_provider_id = 1;
  string uploaded_by_sp_user_id = 2;
  string file_name = 3;
  string file_type = 4;
  string s3_key = 5;
  int64 file_size = 6;
  string classification = 7;
}

message GetDocumentRequest {
  string document_id = 1;
  string service_provider_id = 2;
}

message UpdateDocumentRequest {
  string document_id = 1;
  string service_provider_id = 2;
  string file_name = 3;
  string classification = 4;
  string status = 5;
}

message ListDocumentsRequest {
  string service_provider_id = 1;
  string status = 2;
  string classification = 3;
  int32 limit = 4;  // max 100
  int32 offset = 5;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  int32 total = 2;
}

message DeleteDocumentRequest {
  string document_id = 1;
  string service_provider_id = 2;
}

message DeleteDocumentResponse {
  bool success = 1;
}

// ─── Presigned URLs ─────────────────────────────────────────

message GeneratePresignedURLRequest {
  string document_id = 1;
  string service_provider_id = 2;
  int32 expiry_minutes = 3; // 1–60, validated at service layer
}

message PresignedURLResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ─── Classification ─────────────────────────────────────────

message DocumentClassification {
  string id = 1;
  string document_id = 2;
  string label = 3;
  double confidence_score = 4;
  string classified_by = 5; // USER, AI, SYSTEM
  google.protobuf.Timestamp created_at = 6;
}

message ClassifyDocumentRequest {
  string document_id = 1;
  string service_provider_id = 2;
  string label = 3;
  double confidence_score = 4;
  string classified_by = 5; // USER, AI, SYSTEM
}

message GetDocumentClassificationsRequest {
  string document_id = 1;
  string service_provider_id = 2;
}

message GetDocumentClassificationsResponse {
  repeated DocumentClassification classifications = 1;
}

// ─── Version Tracking ───────────────────────────────────────

message DocumentVersion {
  string id = 1;
  string document_id = 2;
  int32 version_number = 3;
  string s3_key = 4;
  int64 file_size = 5;
  string uploaded_by_sp_user_id = 6;
  string change_summary = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateDocumentVersionRequest {
  string document_id = 1;
  string service_provider_id = 2;
  string s3_key = 3;
  int64 file_size = 4;
  string uploaded_by_sp_user_id = 5;
  string change_summary = 6;
}

message ListDocumentVersionsRequest {
  string document_id = 1;
  string service_provider_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListDocumentVersionsResponse {
  repeated DocumentVersion versions = 1;
  int32 total = 2;
}

message GetDocumentVersionRequest {
  string document_id = 1;
  string service_provider_id = 2;
  int32 version_number = 3;
}

// ─── Download Tracking ──────────────────────────────────────

message DownloadRecord {
  string id = 1;
  string document_id = 2;
  string downloaded_by_user_id = 3;
  int32 version_number = 4;
  string ip_address = 5;
  string user_agent = 6;
  google.protobuf.Timestamp created_at = 7;
}

message TrackDownloadRequest {
  string document_id = 1;
  string service_provider_id = 2;
  string downloaded_by_user_id = 3;
  int32 version_number = 4;
  string ip_address = 5;
  string user_agent = 6;
}
