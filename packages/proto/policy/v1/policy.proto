syntax = "proto3";

package policy.v1;

option go_package = "github.com/trustinbox/proto/gen/policy/v1;policyv1";

service PolicyService {
  rpc EvaluateCommunication(EvaluateCommunicationRequest) returns (EvaluateCommunicationResponse);
  rpc CheckCallbackPermission(CheckCallbackPermissionRequest) returns (CheckCallbackPermissionResponse);
  rpc GetNextAvailableSlot(GetNextAvailableSlotRequest) returns (GetNextAvailableSlotResponse);
}

enum CommunicationCategory {
  COMMUNICATION_CATEGORY_UNSPECIFIED = 0;
  COMMUNICATION_CATEGORY_PERSONAL = 1;
  COMMUNICATION_CATEGORY_SERVICE_PROVIDER = 2;
  COMMUNICATION_CATEGORY_ADVERTISEMENT = 3;
}

enum CommunicationChannel {
  COMMUNICATION_CHANNEL_UNSPECIFIED = 0;
  COMMUNICATION_CHANNEL_PUSH = 1;
  COMMUNICATION_CHANNEL_INBOX = 2;
  COMMUNICATION_CHANNEL_CHAT = 3;
  COMMUNICATION_CHANNEL_CALLBACK = 4;
  COMMUNICATION_CHANNEL_DOCUMENT = 5;
}

enum CommunicationType {
  COMMUNICATION_TYPE_UNSPECIFIED = 0;
  COMMUNICATION_TYPE_NOTIFICATION = 1;
  COMMUNICATION_TYPE_CALLBACK_REQUEST = 2;
  COMMUNICATION_TYPE_CHAT_MESSAGE = 3;
  COMMUNICATION_TYPE_DOCUMENT_SHARE = 4;
  COMMUNICATION_TYPE_CAMPAIGN = 5;
}

enum DecisionCode {
  DECISION_CODE_UNSPECIFIED = 0;
  DECISION_CODE_ALLOW_STANDARD = 1;
  DECISION_CODE_DENY_USER_NOT_FOUND = 2;
  DECISION_CODE_DENY_SP_NOT_VERIFIED = 3;
  DECISION_CODE_DENY_USER_BLOCKED_SP = 4;
  DECISION_CODE_DENY_CATEGORY_DISABLED = 5;
  DECISION_CODE_DENY_DND_ACTIVE = 6;
  DECISION_CODE_DENY_OUTSIDE_AVAILABILITY = 7;
  DECISION_CODE_DENY_AD_CAP_EXCEEDED = 8;
  DECISION_CODE_DENY_SP_SUSPENDED = 9;
  DECISION_CODE_DENY_SPAM_SCORE_HIGH = 10;
  DECISION_CODE_REQUIRE_CALLBACK_APPROVAL = 11;
  DECISION_CODE_SUGGEST_NEXT_AVAILABLE_SLOT = 12;
}

message EvaluateCommunicationRequest {
  string user_id = 1;
  string service_provider_id = 2;
  CommunicationCategory category = 3;
  CommunicationChannel channel = 4;
  CommunicationType communication_type = 5;
  int64 scheduled_unix = 6;
}

message EvaluateCommunicationResponse {
  bool allowed = 1;
  DecisionCode decision_code = 2;
  string reason = 3;
  repeated string applied_rules = 4;
  int64 next_available_unix = 5;
}

message CheckCallbackPermissionRequest {
  string user_id = 1;
  string service_provider_id = 2;
}

message CheckCallbackPermissionResponse {
  bool allowed = 1;
  DecisionCode decision_code = 2;
  string reason = 3;
}

message GetNextAvailableSlotRequest {
  string user_id = 1;
  string service_provider_id = 2;
  CommunicationCategory category = 3;
}

message GetNextAvailableSlotResponse {
  bool has_slot = 1;
  int64 slot_start_unix = 2;
  int64 slot_end_unix = 3;
}
