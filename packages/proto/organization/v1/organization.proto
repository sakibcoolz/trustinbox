syntax = "proto3";

package organization.v1;

option go_package = "github.com/trustinbox/proto/gen/organization/v1;organizationv1";

import "google/protobuf/timestamp.proto";

service ServiceProviderService {
  rpc CreateServiceProvider(CreateServiceProviderRequest) returns (ServiceProvider);
  rpc GetServiceProvider(GetServiceProviderRequest) returns (ServiceProvider);
  rpc ListServiceProviders(ListServiceProvidersRequest) returns (ListServiceProvidersResponse);
  rpc UpdateServiceProvider(UpdateServiceProviderRequest) returns (ServiceProvider);
  rpc VerifyServiceProvider(VerifyServiceProviderRequest) returns (VerifyServiceProviderResponse);
  rpc SuspendServiceProvider(SuspendServiceProviderRequest) returns (SuspendServiceProviderResponse);

  // Service provider users
  rpc AddServiceProviderUser(AddServiceProviderUserRequest) returns (ServiceProviderUser);
  rpc RemoveServiceProviderUser(RemoveServiceProviderUserRequest) returns (RemoveServiceProviderUserResponse);
  rpc ListServiceProviderUsers(ListServiceProviderUsersRequest) returns (ListServiceProviderUsersResponse);
  rpc GetServiceProviderUser(GetServiceProviderUserRequest) returns (ServiceProviderUser);

  // Invitations & Team management
  rpc InviteTeamMember(InviteTeamMemberRequest) returns (InviteTeamMemberResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc ChangeTeamMemberRole(ChangeTeamMemberRoleRequest) returns (ChangeTeamMemberRoleResponse);
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse);
}

message CreateServiceProviderRequest {
  string name = 1;
  string legal_name = 2;
  string industry = 3;
  string description = 4;
  string website = 5;
  string admin_user_id = 6;
}

message GetServiceProviderRequest {
  string service_provider_id = 1;
}

message ListServiceProvidersRequest {
  string search = 1;
  string verification_status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListServiceProvidersResponse {
  repeated ServiceProvider service_providers = 1;
  int32 total = 2;
}

message UpdateServiceProviderRequest {
  string service_provider_id = 1;
  string name = 2;
  string legal_name = 3;
  string industry = 4;
  string description = 5;
  string website = 6;
}

message ServiceProvider {
  string id = 1;
  string name = 2;
  string legal_name = 3;
  string industry = 4;
  string description = 5;
  string verification_status = 6; // PENDING, VERIFIED, REJECTED, SUSPENDED
  string status = 7;              // ACTIVE, SUSPENDED, DEACTIVATED
  string website = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message VerifyServiceProviderRequest {
  string service_provider_id = 1;
  string decision = 2; // APPROVED, REJECTED
  string reason = 3;
  string admin_user_id = 4;
}

message VerifyServiceProviderResponse {
  bool success = 1;
}

message SuspendServiceProviderRequest {
  string service_provider_id = 1;
  string reason = 2;
  string admin_user_id = 3;
}

message SuspendServiceProviderResponse {
  bool success = 1;
}

message AddServiceProviderUserRequest {
  string service_provider_id = 1;
  string user_id = 2;
  string role = 3; // SP_ADMIN, AGENT, ANALYST
}

message ServiceProviderUser {
  string id = 1;
  string service_provider_id = 2;
  string user_id = 3;
  string role = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message RemoveServiceProviderUserRequest {
  string service_provider_user_id = 1;
  string service_provider_id = 2;
}

message RemoveServiceProviderUserResponse {
  bool success = 1;
}

message ListServiceProviderUsersRequest {
  string service_provider_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListServiceProviderUsersResponse {
  repeated ServiceProviderUser users = 1;
  int32 total = 2;
}

message GetServiceProviderUserRequest {
  string service_provider_user_id = 1;
}

// --- Invitation & Team management messages ---

message InviteTeamMemberRequest {
  string service_provider_id = 1;
  string email = 2;
  string role = 3; // SP_ADMIN, AGENT, ANALYST
  string invited_by_user_id = 4;
}

message InviteTeamMemberResponse {
  string invitation_id = 1;
  string token = 2;
}

message AcceptInvitationRequest {
  string token = 1;
  string user_id = 2;
}

message AcceptInvitationResponse {
  bool success = 1;
}

message RevokeInvitationRequest {
  string invitation_id = 1;
  string service_provider_id = 2;
  string actor_user_id = 3;
}

message RevokeInvitationResponse {
  bool success = 1;
}

message ListInvitationsRequest {
  string service_provider_id = 1;
  string status = 2; // PENDING, ACCEPTED, EXPIRED, REVOKED (empty = all)
  int32 limit = 3;
  int32 offset = 4;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  int32 total = 2;
}

message Invitation {
  string id = 1;
  string email = 2;
  string service_provider_id = 3;
  string role = 4;
  string status = 5;
  string invited_by = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ChangeTeamMemberRoleRequest {
  string service_provider_id = 1;
  string target_user_id = 2;
  string new_role = 3; // SP_ADMIN, AGENT, ANALYST
  string actor_user_id = 4;
}

message ChangeTeamMemberRoleResponse {
  bool success = 1;
}

message RemoveTeamMemberRequest {
  string service_provider_id = 1;
  string target_user_id = 2;
  string actor_user_id = 3;
}

message RemoveTeamMemberResponse {
  bool success = 1;
}
