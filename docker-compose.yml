services:
  # ─── Infrastructure ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustinbox
      POSTGRES_PASSWORD: trustinbox_dev
      POSTGRES_DB: trustinbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustinbox"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trustinbox
      MINIO_ROOT_PASSWORD: trustinbox_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Go Services ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: auth-service
    environment:
      SERVICE_NAME: auth-service
      GRPC_PORT: "50051"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      SERVICE_NAME: user-service
      GRPC_PORT: "50052"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy

  policy-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: policy-service
    environment:
      SERVICE_NAME: policy-service
      GRPC_PORT: "50053"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy

  organization-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: organization-service
    environment:
      SERVICE_NAME: organization-service
      GRPC_PORT: "50054"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      SERVICE_NAME: notification-service
      GRPC_PORT: "50055"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50055:50055"
    depends_on:
      postgres:
        condition: service_healthy

  communication-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: communication-service
    environment:
      SERVICE_NAME: communication-service
      GRPC_PORT: "50056"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: ai-service
    environment:
      SERVICE_NAME: ai-service
      GRPC_PORT: "50057"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50057:50057"
    depends_on:
      postgres:
        condition: service_healthy

  worker-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: worker-service
    environment:
      SERVICE_NAME: worker-service
      GRPC_PORT: "50058"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: trustinbox
      DB_PASSWORD: trustinbox_dev
      DB_NAME: trustinbox
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "50058:50058"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── GraphQL Gateway ──────────────────────────────────────
  graphql-gateway:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_NAME: graphql-bff
        SERVICE_DIR: gateway
    environment:
      HTTP_PORT: "4000"
      AUTH_SERVICE_ADDR: auth-service:50051
      USER_SERVICE_ADDR: user-service:50052
      POLICY_SERVICE_ADDR: policy-service:50053
      ORG_SERVICE_ADDR: organization-service:50054
      NOTIFICATION_SERVICE_ADDR: notification-service:50055
      COMMUNICATION_SERVICE_ADDR: communication-service:50056
      AI_SERVICE_ADDR: ai-service:50057
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - user-service
      - policy-service

  # ─── Frontend ─────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/next.Dockerfile
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://graphql-gateway:4000/graphql
    ports:
      - "3000:3000"
    depends_on:
      - graphql-gateway

  admin:
    build:
      context: ./apps/admin
      dockerfile: ../../infra/docker/next.Dockerfile
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://graphql-gateway:4000/graphql
    ports:
      - "3001:3001"
    depends_on:
      - graphql-gateway

  # ─── Observability ────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  pgdata:
  redisdata:
  miniodata:
